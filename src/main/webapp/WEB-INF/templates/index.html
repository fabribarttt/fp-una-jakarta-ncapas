<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Productos</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">

        <!-- Formulario para Agregar Producto -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Agregar Nuevo Producto</h5>
            </div>
            <div class="card-body">
                <form class="row g-3" method="post" th:action="@{/}">
                    <div class="col-md-4">
                        <label class="form-label">Producto</label>
                        <input type="text" class="form-control" placeholder="Nombre del producto" name="nombreProducto"
                            required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Cantidad</label>
                        <input type="number" class="form-control" placeholder="0" name="cantidad" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Precio</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" class="form-control" placeholder="0.00" step="0.01" name="precio"
                                required>
                        </div>
                    </div>
                    <div class="col-12 text-end">
                        <button type="submit" class="btn btn-primary">Agregar Producto</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabla de Productos -->
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h5 class="mb-0">Lista de Productos</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Producto</th>
                                <th>Cantidad</th>
                                <th>Precio</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Lista de productos -->
                            <tr th:each="producto : ${productos}">
                                <td><span class="badge bg-secondary" th:text="${producto.id}"></span></td>
                                <td class="fw-bold" th:text="${producto.producto}"></td>
                                <td th:text="${producto.cantidad}"></td>
                                <td th:text="${producto.precio}"></td>
                                <td class="text-end">
                                    <button class="btn btn-sm btn-outline-warning me-1" data-bs-toggle="modal"
                                        data-bs-target="#editModal"
                                        th:attr="onclick=|abrirModalEditar(${producto.id}, '${producto.producto}', ${producto.cantidad}, ${producto.precio})|">
                                        Modificar
                                    </button>
                                    <button class="btn btn-sm btn-danger"
                                        th:attr="hx-delete=@{/productos(id=${producto.id})}"
                                        th:data-target="'#producto-' + ${producto.id}" hx-target="closest tr"
                                        hx-swap="outerHTML swap:0.5s"
                                        hx-confirm="¿Estás seguro de eliminar este producto?">
                                        Eliminar
                                    </button>
                                </td>

                            </tr>

                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- MODAL MODIFICAR -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-warning">
                    <h5 class="modal-title" id="editModalTitle">Modificar Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editId" name="id">
                    <div class="row g-3">
                        <div class="col-6">
                            <label class="form-label">Cantidad</label>
                            <input type="number" class="form-control" id="editCantidad" name="cantidad">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Precio</label>
                            <input type="number" class="form-control" id="editPrecio" name="precio" step="0.01">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Producto</label>
                            <input type="text" class="form-control" id="editProducto" name="nombreProducto">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-warning" hx-put="/productos"
                        hx-include="#editId, #editCantidad, #editPrecio, #editProducto" hx-swap="none"
                        data-bs-dismiss="modal">
                        Guardar Cambios
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS (Necesario únicamente para abrir/cerrar Modales) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
        integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
        crossorigin="anonymous"></script>
    <script>
        htmx.config.methodsThatUseUrlParams = ["get", "put"];
    </script>
    <script>
        function abrirModalEditar(id, producto, cantidad, precio) {
            document.getElementById('editId').value = id;
            document.getElementById('editProducto').value = producto;
            document.getElementById('editCantidad').value = cantidad;
            document.getElementById('editPrecio').value = precio;
            document.getElementById('editModalTitle').innerText = 'Modificar: ' + producto;
        }
    </script>
</body>

</html>
